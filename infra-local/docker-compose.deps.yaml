version: "3.8"

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.12
    container_name: sea-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./config/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      CLICKHOUSE_DB: sea_retailer

  postgres:
    image: postgres:16
    container_name: sea-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: sea_retailer
      POSTGRES_USER: sea_retailer
      POSTGRES_PASSWORD: changeme
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./config/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: sea-keycloak
    command: start-dev --import-realm
    ports:
      - "8180:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./config/keycloak/realm-export.json:/opt/keycloak/data/import/realm.json:ro

volumes:
  clickhouse-data:
  postgres-data:
