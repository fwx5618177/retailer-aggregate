[project]
name = "sea-retailer-app"
version = "0.1.0"
description = "SEA Retailer Top Selling Intelligence - Streamlit Demo App"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.40.0",
    "duckdb>=1.0.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "plotly>=5.24.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
