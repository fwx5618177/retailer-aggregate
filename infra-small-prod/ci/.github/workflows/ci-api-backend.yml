name: CI - API Backend

on:
  push:
    paths: ["api-backend/**"]
  pull_request:
    paths: ["api-backend/**"]

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        run: ./mvnw clean verify

      - name: Build Docker image
        run: docker build -t sea-retailer/api-backend:${{ github.sha }} .
