spring:
  datasource:
    url: jdbc:h2:mem:sea_retailer;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/sea-retailer
  h2:
    console:
      enabled: true
      path: /h2-console

# In local profile, security is disabled via SecurityConfig @Profile check.
# ClickHouse queries will fail gracefully if ClickHouse is not running locally.

clickhouse:
  url: jdbc:ch://localhost:8123/sea_retailer
  username: default
  password:

logging:
  level:
    com.searetailer: DEBUG
    org.springframework.security: DEBUG
